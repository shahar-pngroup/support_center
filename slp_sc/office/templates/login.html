<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>כניסת סוכן</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:Arial,sans-serif;background:#f4f5f7;direction:rtl;display:flex;align-items:center;justify-content:center;height:100dvh;padding:20px;}

.login-box{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:32px 24px;width:100%;max-width:360px;}
.login-title{font-size:19px;font-weight:700;color:#1a1a2e;text-align:center;margin-bottom:6px;}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:24px;}

label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:600;}
.field{margin-bottom:16px;}
input{width:100%;padding:12px 14px;border:1px solid #dde;border-radius:9px;font-size:16px;direction:rtl;background:#fafbff;outline:none;transition:border-color .2s;-webkit-appearance:none;}
input:focus{border-color:#4a6cf7;}

.error-box{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center;}

#login-btn{width:100%;padding:13px;background:#4a6cf7;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;-webkit-appearance:none;}
#login-btn:disabled{background:#c4c9d8;}
#login-btn:not(:disabled):active{background:#3a5ce5;}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-title">🔐 כניסת סוכן</div>
  <div class="login-sub">SLP Hub</div>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="slp_code">קוד סוכן</label>
      <input type="text" id="slp_code" name="slp_code" inputmode="numeric" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">סיסמה</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="login-btn">כניסה</button>
  </form>
</div>

</body>
</html>
